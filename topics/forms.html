<!DOCTYPE html>
<html>
    <title> FORMS</title>
    <body>
        <forms>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name"><br><br> 

            <label for="password">Password:</label>
            <input type="password" id="password" name="password"><br><br>
            
            <label for="gender">Gender:</label>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label><br><br>

            <label for="hobbies">Hobbies:</label>
            <input type="checkbox" id="sports" name="sports" value="sports">
            <label for="subscribe">Sports</label>
            <input type="checkbox" id="music" name="music" value="music">
            <label for="music">Music</label>
            <input type="checkbox" id="reading" name="reading" value="reading">
            <label for="music">Reading</label><br><br>

            <label for="hobbies">Address:</label><br><br>
            <textarea id="message" name="message" rows="4" cols="50"> Enter your message here...</textarea><br><br>
            <select id="country" name="country">
                <option value="usa">USA</option>
                <option value="canada">Canada</option>
                <option value="uk">UK</option><br><br>
            </select>
            <br><br>
            <input type="submit" value="Submit"><br><br>
            <button type="button">Click Me!</button>
        </forms>
    </body>
</html>
